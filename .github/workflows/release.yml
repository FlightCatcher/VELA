name: VELA Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --dev --locked
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  desktop-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/vela-desktop/package-lock.json
      - working-directory: integrations/vela-desktop
        run: npm ci
      - name: Run desktop tests with portable failure output
        working-directory: integrations/vela-desktop
        shell: bash
        run: |
          set +e
          output="$(npm test 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            summary="$(printf '%s' "$output" | tail -c 7000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Desktop test failure::$summary"
            exit "$status"
          fi
      - working-directory: integrations/vela-desktop
        run: npm audit --omit=dev

  build-windows:
    needs: [quality, desktop-test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/vela-desktop/package-lock.json
      - working-directory: integrations/vela-desktop
        run: npm ci
      - name: Build Windows installers
        working-directory: integrations/vela-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:win -- --publish never
      - name: Fresh Windows one-click install smoke test
        shell: pwsh
        run: ./integrations/vela-desktop/scripts/fresh-install-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            integrations/vela-desktop/dist/VELA-Setup-*.exe
            integrations/vela-desktop/dist/VELA-Setup-*.exe.blockmap
            integrations/vela-desktop/dist/VELA-Desktop.exe
            integrations/vela-desktop/dist/latest.yml

  build-macos:
    needs: [quality, desktop-test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/vela-desktop/package-lock.json
      - working-directory: integrations/vela-desktop
        run: npm ci
      - name: Build unsigned macOS beta packages
        working-directory: integrations/vela-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:mac -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            integrations/vela-desktop/dist/VELA-*.dmg
            integrations/vela-desktop/dist/VELA-*.zip
            integrations/vela-desktop/dist/latest-mac.yml

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: VELA ${{ github.ref_name }} Public Beta
          generate_release_notes: true
          prerelease: true
          files: release-assets/*
