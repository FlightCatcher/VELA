name: VELA Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --dev --locked
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integrations/vela-desktop/package-lock.json
      - name: Verify desktop renderer
        working-directory: integrations/vela-desktop
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          npm ci
          npm test
          npm audit --omit=dev
          npm run build
      - uses: softprops/action-gh-release@v2
        with:
          name: VELA ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            integrations/vela-desktop/dist/VELA-Setup-*.exe
            integrations/vela-desktop/dist/VELA-Setup-*.exe.blockmap
            integrations/vela-desktop/dist/VELA-Desktop.exe
            integrations/vela-desktop/dist/latest.yml
